<!doctype html><html><head><meta charset="utf-8"><title>Contact – Demo Shop</title><link rel="stylesheet" href="/demo/style.css"></head><body>
<header><span class="brand">Demo Shop</span><a href="/demo/">Home</a><a href="/demo/products">Products</a><a href="/demo/contact">Contact</a><a href="/demo/login">Login</a><a href="/demo/cart">Cart (<span id="cart-count">0</span>)</a></header>
<main><h1>Contact us</h1>
<form id="contact" novalidate><input id="name" placeholder="Name"><input id="email" placeholder="Email"><textarea id="message" placeholder="Message"></textarea><button type="submit">Send</button><div class="alert" id="alert" hidden></div></form></main><script>const cart=()=>JSON.parse(localStorage.getItem("cart")||"[]");document.getElementById("cart-count").textContent=cart().length;</script>
<script>document.getElementById('contact').addEventListener('submit',e=>{e.preventDefault();const a=document.getElementById('alert');a.hidden=false;
const $=id=>document.getElementById(id).value;const errs=[];if(!$('name').trim())errs.push('Name is required');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($('email')))errs.push('A valid email is required');if($('message').trim().length<10)errs.push('Message must be at least 10 characters');
if(errs.length){a.className='alert error';a.textContent=errs.join('. ')}else{a.className='alert success';a.textContent='Thank you! We will get back to you soon.'}});</script></body></html>
