name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: qa, POSTGRES_PASSWORD: qa, POSTGRES_DB: qa_platform }
        ports: ["5440:5432"]
        options: --health-cmd "pg_isready -U qa" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6390:6379"]
    env:
      DATABASE_URL: postgresql://qa:qa@localhost:5440/qa_platform
      TEST_DATABASE_URL: postgresql://qa:qa@localhost:5440/qa_platform_test
      REDIS_URL: redis://localhost:6390
      JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
      APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Create test database
        run: PGPASSWORD=qa psql -h localhost -p 5440 -U qa -d qa_platform -c "CREATE DATABASE qa_platform_test"
      - name: Typecheck & build
        run: |
          npx prisma generate --schema backend/prisma/schema.prisma
          npm run typecheck -w backend
          npm run build -w frontend
      - name: Backend unit, engine and integration tests
        run: npm test -w backend
      - name: Start platform for E2E
        run: |
          cd backend && npx prisma migrate deploy
          nohup npx tsx src/server.ts > ../api.log 2>&1 &
          nohup npx tsx src/worker.ts > ../worker.log 2>&1 &
          cd ../frontend && nohup npx vite --port 5173 > ../web.log 2>&1 &
          npx wait-on -t 60000 http://localhost:4100/api/health http://localhost:5173
      - name: E2E tests (Playwright)
        run: npm test -w e2e
      - if: failure()
        run: tail -n 100 api.log worker.log web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }
